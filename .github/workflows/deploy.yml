name: Frontend Self-hosted Deploy

on:
  push:
    branches:
      - happy-end2  # 或者是你希望触发部署的分支

jobs:
  build-and-deploy:
    runs-on: self-hosted  # 关键：这会让任务在你刚才配置的 PM2 进程中运行

    steps:
      - name: Setup SSH known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY_LENOVO_SHOP }}

      - name: Install Dependencies
        run: pnpm install

      # 1. 修复队友大小写乱写的问题
      - name: Case Sensitivity Hack
        run: |
          find src -depth -exec sh -c '
            for item do
              lower=$(echo "$item" | tr "[:upper:]" "[:lower:]")
              if [ "$item" != "$lower" ] && [ ! -e "$lower" ]; then
                ln -s "$(basename "$item")" "$lower"
              fi
            done
          ' sh {} +

      # 2. 注入环境变量 (使用 GitHub Secrets)
      - name: Inject Environment Variables
        run: |
          echo "VITE_SERVER_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" > .env.production
          echo "VITE_WS_URL=wss://api.jxutcm.top/ws" >> .env.production
          echo "VITE_SERVER_PUBLIC_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env.production

      # 3. 强行构建 (限制 1024MB 内存，防止 1.8GB 内存溢出)
      - name: Build Project
        run: |
          export NODE_OPTIONS="--max-old-space-size=1024"
          ./node_modules/.bin/vite build

      # 4. 本地部署：直接将 dist 内容移动到 shop 目录
      - name: Deploy to Web Root
        run: |
          # 确保目标目录存在
          mkdir -p /www/wwwroot/shop.jxutcm.top
          # 先清空旧的产物（保留目录本身）
          rm -rf /www/wwwroot/shop.jxutcm.top/*
          # 将 dist 下的所有内容复制过去
          cp -r dist/* /www/wwwroot/shop.jxutcm.top/
          # 修正权限，确保 Nginx 用户 www 可以访问
          chown -R www:www /www/wwwroot/shop.jxutcm.top/