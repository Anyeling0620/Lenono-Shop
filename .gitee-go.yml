version: '1.0'
name: lenovo-shop-ultra-ci
displayName: '京东云 x AI 深度荣耀审计流水线'
triggers:
  push:
    - matchType: precision
      value: master
    - matchType: precision
      value: latest
stages:
  - name: build_and_audit
    displayName: '核心构建与 AI 审计'
    strategy:
      parallel: false
    steps:
      - step: shell@1
        name: deploy_and_report
        displayName: '执行深度审计脚本'
        # 这里的指令会在你的京东云服务器上直接运行
        script: |
          # 1. 进入工作目录
          cd /root/lenovo-shop-ci/lenovo-shop
          
          # 2. 强制同步代码（解决 gitignore 导致的本地环境脏数据问题）
          git fetch --all
          git reset --hard origin/$GITEE_BRANCH
          
          # 3. 运行深度审计引擎
          chmod +x /root/lenovo-shop-ci/deploy.sh
          sh /root/lenovo-shop-ci/deploy.sh